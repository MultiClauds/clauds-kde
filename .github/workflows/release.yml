name: Release

# Every merge to main is a release: the version comes from scripts/next-version.sh (Semantic
# Versioning, from the commit titles since the last tag), the .deb is built with that version on
# Ubuntu 26.04, the tag vX.Y.Z is created, the .deb is attached to a GitHub release, and the apt
# repository on https://products.lemche.net/clauds-kde/apt is rebuilt (pages.yml), so
# `sudo apt update && sudo apt upgrade` picks up the new version.
# Put [skip release] in the merge commit message to merge without a release.

on:
  push:
    branches: [main]
  # A pull request that touches the build builds the .deb and the apt repository too, but makes no
  # tag, no release and no deploy.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Makefile"
      - "VERSION"
      - "scripts/**"
      - "kde/packaging/**"
      - "kde/CMakeLists.txt"
      - "kde/src/app/CMakeLists.txt"

permissions:
  contents: read

# One release at a time, so two merges cannot pick the same version.
concurrency:
  group: release-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the version needs the history and the tags
          fetch-tags: true
          persist-credentials: false

      - name: Pick the version
        id: version
        run: |
          version=$(scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null \
             || [ -n "$(git tag --points-at HEAD --list 'v[0-9]*')" ]; then
            echo "This commit is already released as v$version. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Release version: $version"

  deb:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # The .deb is for Kubuntu 26.04, so it is built against the Qt and KDE Frameworks of 26.04.
    container: ubuntu:26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Put the version in the build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: echo "$VERSION" > VERSION

      - name: Install Qt 6 and KDE Frameworks 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake g++ make file dpkg-dev apt-utils extra-cmake-modules \
            qt6-base-dev qt6-declarative-dev qt6-webengine-dev libgl-dev \
            libkf6statusnotifieritem-dev libkf6notifications-dev libkf6coreaddons-dev libkf6colorscheme-dev

      - name: Build, test and package
        run: |
          make BUILD_TYPE=RelWithDebInfo test
          make deb
          dpkg-deb --info build-kde/clauds_*.deb

      - name: Check that the apt repository builds (unsigned)
        run: scripts/build-apt-repo.sh build-apt build-kde/clauds_*.deb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clauds-deb
          path: build-kde/clauds_*.deb

  release:
    needs: [version, deb]
    if: needs.version.outputs.skip != 'true' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # creates the tag and the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clauds-deb
          path: dist

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/clauds_*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Clauds KDE $VERSION" \
            --generate-notes

      - name: Add the release to the LemcheNET apt repository
        env:
          # Fine-grained token with Contents: read and write on LemcheNET/lemchenet.github.io only.
          TAG: v${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ secrets.LEMCHENET_APT_DISPATCH_TOKEN }}
        # The nightly rebuild of products.lemche.net/apt picks the release up if this fails.
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::LEMCHENET_APT_DISPATCH_TOKEN is not set: the release reaches products.lemche.net/apt at the nightly rebuild."
            exit 0
          fi
          gh api repos/LemcheNET/lemchenet.github.io/dispatches -f event_type=apt-release \
            -f "client_payload[repository]=$GITHUB_REPOSITORY" -f "client_payload[tag]=$TAG" \
            || echo "::warning::The dispatch failed: the release reaches products.lemche.net/apt at the nightly rebuild."

  # A release made with GITHUB_TOKEN does not start other workflows, so the apt repository is
  # rebuilt here, by calling the Pages workflow.
  apt-repo:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    secrets: inherit
